name: Daily Redesign Update

on:
  schedule:
    # 11:00 UTC = 6:00 AM EST. GitHub's own scheduler can delay or
    # occasionally skip scheduled triggers by hours during high platform
    # load - this is a documented GitHub limitation, not something a
    # workflow config can fully control. A second backup trigger a few
    # hours later catches the day's build if the first one was late or
    # missed. It's safe to run twice: build-daily-rounds.js skips the
    # whole build if today's archive file already exists.
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: {}   # lets you trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build today's rounds and screenshots
        run: node build-daily-rounds.js

      - name: Commit and push updated files
        run: |
          git config user.name "guess-the-redesign-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Daily rounds update"
          git pull --rebase origin main
          git push
