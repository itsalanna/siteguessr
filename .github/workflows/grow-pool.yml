name: Grow Round Pool

on:
  schedule:
    # Mondays at 10:00 UTC, an hour before the daily build runs
    - cron: '0 10 * * 1'
  workflow_dispatch: {}   # lets you trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Grow the pool
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node grow-pool.js

      - name: Commit and push updated pool
        run: |
          git config user.name "guess-the-redesign-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rounds-pool.json
          git diff --staged --quiet || git commit -m "Grow round pool"
          git push
