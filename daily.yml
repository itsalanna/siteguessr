name: Daily Redesign Update

on:
  schedule:
    # 11:00 UTC = 6:00 AM EST (fixed, doesn't shift for daylight saving)
    - cron: '0 11 * * *'
  workflow_dispatch: {}   # lets you trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build today's rounds and screenshots
        run: node build-daily-rounds.js

      - name: Commit and push updated files
        run: |
          git config user.name "guess-the-redesign-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images rounds-data.json
          git diff --staged --quiet || git commit -m "Daily rounds update"
          git push
